$kind: http-request
name: Get All Roles
method: GET
url: '{{baseUrl}}/roles'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 2xx", function () {
          pm.response.to.be.success;
      });
      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

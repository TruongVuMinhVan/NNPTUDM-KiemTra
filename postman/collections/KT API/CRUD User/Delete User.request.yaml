$kind: http-request
name: Delete User
method: DELETE
url: '{{baseUrl}}/users/:id'
order: 6000
pathVariables:
  - key: id
    value: ''
    description: User ID
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 2xx", function () {
          pm.response.to.be.success;
      });

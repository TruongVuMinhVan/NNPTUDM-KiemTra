$kind: http-request
name: Get User By ID
method: GET
url: '{{baseUrl}}/users/:id'
order: 4000
pathVariables:
  - key: id
    value: ''
    description: User ID
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 2xx", function () {
          pm.response.to.be.success;
      });
      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });
